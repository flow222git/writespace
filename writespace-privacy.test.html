<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>writespace-privacy tests</title>
<script>window.__JTE_PRIVACY_TEST = true;</script>
<script src="https://flow222git.github.io/jte-platform-2026/jte-crypto.js"></script>
<script src="https://flow222git.github.io/jte-platform-2026/jte-privacy.js"></script>
<script src="writespace-privacy.js"></script>
</head>
<body>
<pre id="out">running...</pre>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
const lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
function assert(c, m){ if(!c) throw new Error(m || 'assert failed'); }
function eq(a, b, m){ if(a !== b) throw new Error((m||'eq') + ' got['+a+'] want['+b+']'); }
async function check(name, fn){
  try { await fn(); pass++; log('PASS ' + name); }
  catch (e){ fail++; log('FAIL ' + name + ' :: ' + (e && e.message || e)); }
}

// fake Firestore（沿用框架；此測本檔不直接用，保留以對齊既有 runner）
function makeFakeDb(){
  const store = {};
  return {
    _store: store,
    collection(){ return {
      doc(id){ return {
        get(){ return Promise.resolve({ exists: id in store, data(){ return store[id]; } }); },
        set(data, opts){ store[id] = (opts && opts.merge) ? Object.assign({}, store[id], data) : data; return Promise.resolve(); }
      }; }
    }; }
  };
}

function unlocked(){
  const db = makeFakeDb(); JtePrivacy._reset(); JtePrivacy._setBackend({db, email:'u@x.com'});
  sessionStorage.clear(); localStorage.removeItem('jte_dek_u@x.com');
  return JtePrivacy._doEnable('pw-12345678');
}
const sample = { id:'record-1', title:'換工作', createdAt:'2026-06-12T01:00:00Z', updatedAt:'2026-06-12T02:00:00Z',
  entries:{topic:'換工作',iFirst:'我很焦慮',you:'你在猶豫',observer:'他看得很遠',iFinal:'我決定試試',action:'明天投履歷'},
  analysis:{emotions:['焦慮']}, summaryMarkdown:'# 報告' };

async function run(){
  assert(typeof crypto !== 'undefined' && crypto.subtle, 'WebCrypto unavailable (need secure context)');
  assert(typeof JteCrypto === 'object', 'JteCrypto 應載入');
  assert(typeof JtePrivacy === 'object', 'JtePrivacy 應載入');
  assert(typeof WsPrivacy === 'object', 'WsPrivacy 應載入');

  await check('recordToCloud（解鎖）：產出無明文、含 enc 密文、保留 id/時間', async () => {
    await unlocked();
    const c = await WsPrivacy.recordToCloud(sample);
    eq(c.id,'record-1','id 保留'); assert(c.enc&&c.enc.iv&&c.enc.ct,'enc 密文');
    eq(c.entries,undefined,'無明文 entries'); eq(c.summaryMarkdown,undefined,'無明文 summary'); eq(c.title,undefined,'無明文 title');
    assert(JSON.stringify(c).indexOf('焦慮')===-1,'整個雲端物件不含任何明文書寫');
  });
  await check('cloudToRecord（解鎖）：還原整筆書寫', async () => {
    await unlocked();
    const c = await WsPrivacy.recordToCloud(sample);
    const r = await WsPrivacy.cloudToRecord(c);
    eq(r.entries.iFirst,'我很焦慮','還原 entries'); eq(r.summaryMarkdown,'# 報告','還原 summary'); eq(r.title,'換工作','還原 title'); eq(r.id,'record-1','id');
  });
  await check('recordToCloud（未解鎖）：reject，不產生明文上傳物', async () => {
    JtePrivacy.lock(); sessionStorage.clear(); localStorage.removeItem('jte_dek_u@x.com');
    let threw=false; try{ await WsPrivacy.recordToCloud(sample);}catch(e){threw=true;} assert(threw,'未解鎖應 reject');
  });
  await check('cloudToRecord（未解鎖）：回 null（無法解密）', async () => {
    await unlocked(); const c=await WsPrivacy.recordToCloud(sample);
    JtePrivacy.lock(); sessionStorage.clear(); localStorage.removeItem('jte_dek_u@x.com');
    const r=await WsPrivacy.cloudToRecord(c); eq(r,null,'鎖定回 null');
  });
  await check('mergeRecords：依 id 去重、updatedAt 新者勝', async () => {
    const local=[{id:'a',updatedAt:'2026-06-12T05:00:00Z',title:'本機新'},{id:'b',updatedAt:'2026-06-10T00:00:00Z',title:'只本機'}];
    const cloud=[{id:'a',updatedAt:'2026-06-12T01:00:00Z',title:'雲端舊'},{id:'c',updatedAt:'2026-06-11T00:00:00Z',title:'只雲端'}];
    const m=WsPrivacy.mergeRecords(local,cloud);
    const byId={}; m.forEach(r=>byId[r.id]=r);
    eq(Object.keys(byId).sort().join(','),'a,b,c','三筆都在');
    eq(byId.a.title,'本機新','a 取較新的本機版'); eq(byId.c.title,'只雲端','雲端獨有併入');
  });

  log('---'); log('DONE pass=' + pass + ' fail=' + fail);
  document.title = fail ? ('FAIL ' + fail) : 'OK';
  window.__done = true;
  try { await fetch('/__result', { method: 'POST', body: lines.join('\n') }); } catch (e) {}
}
window.__done = false;
run().catch(function(e){
  log('FATAL ' + (e && e.message || e));
  if (!/DONE/.test(lines.join('\n'))) log('DONE pass=' + pass + ' fail=' + (fail + 1));
  document.title = 'FAIL';
  window.__done = true;
  try { fetch('/__result', { method: 'POST', body: lines.join('\n') }); } catch (_) {}
});
</script>
</body></html>
